<!DOCTYPE html>

<html>

<head>

<title>Welcome to my fun maths quiz!</title>

    <style>
        body {
            font-family:arial;
            background-color: dark grey;
            text-align: center;
            padding: 30px;
        }

        .quiz {
            background-color: white;
            padding: 25px;
            border-radius: 10px;
            max-width: 500px;
            margin: auto;

            
        #feedback {
            font-weight: bold;
        }
    </style>
</head?

    <body>
<div class="quiz">

    <h1>Maths Quiz</h1>

    <p id="questionNumber"></p>

    <h2 id="question"></h2>

        <div id="answers"></div>

        <p id="error"></p>

        <p id="feedback"></p>

        <button id="checkButton" onclick="checkAnswer()">
            Check Answer
        </button>

     <button id="nextButton" onclick="nextQuestion()" hidden>
            Next Question
        </button>

        <h2 id="score"></h2>

        <button onclick="restartQuiz()">
            Restart Quiz
        </button>

        <button onclick="newQuiz()">
            New Quiz
        </button>

</div>
        <script>

// our Maths Questions
            l
let questions = [
    {
        question: "What is 5 + 7?",
        answers: ["10", "12", "14", "15"],
        correct: "12"
    },
    {
        question: "What is 10 × 4?",
        answers: ["20", "30", "40", "50"],
        correct: "40"
    },
    {
        question: "What is 20 - 8?",
        answers: ["10", "12", "14", "16"],
        correct: "12"
    }
];

let currentQuestion = 0;
let score = 0;

function displayQuestion() {

    document.getElementById("error").textContent = "";
    document.getElementById("feedback").textContent = "";

    document.getElementById("questionNumber").textContent =
        "Question " + (currentQuestion + 1) + " of " + questions.length;

    document.getElementById("question").textContent =
        questions[currentQuestion].question;

    let answersHTML = "";

    questions[currentQuestion].answers.forEach(answer => {
        answersHTML += `
            <label style="display:block; margin:10px;">
                <input type="radio" name="answer" value="${answer}">
                ${answer}
            </label>
        `;
    });

    document.getElementById("answers").innerHTML = answersHTML;

    document.getElementById("checkButton").hidden = false;
    document.getElementById("nextButton").hidden = true;

    document.getElementById("score").textContent =
        "Score: " + score;
}

function checkAnswer() {

    let selectedAnswer = document.querySelector(
        'input[name="answer"]:checked'
    );

    // Show red error if no answer is selected
    if (!selectedAnswer) {
        document.getElementById("error").textContent =
            "Please select an answer before continuing!";

        document.getElementById("error").style.color = "red";
        return;
    }

    document.getElementById("error").textContent = "";

    let correctAnswer = questions[currentQuestion].correct;

    if (selectedAnswer.value === correctAnswer) {

        score++;

        document.getElementById("feedback").textContent =
            "Correct! Well done!";

        document.getElementById("feedback").style.color = "green";

    } else {

        document.getElementById("feedback").textContent =
            "Incorrect! The correct answer was " + correctAnswer;

        document.getElementById("feedback").style.color = "red";
    }

    document.getElementById("score").textContent =
        "Score: " + score;

    document.getElementById("checkButton").hidden = true;
    document.getElementById("nextButton").hidden = false;
}

function nextQuestion() {

    if (currentQuestion < questions.length - 1) {

        currentQuestion++;
        displayQuestion();

    } else {

        document.getElementById("question").textContent =
            "Quiz complete!";

        document.getElementById("questionNumber").textContent = "";

        document.getElementById("answers").innerHTML = "";

        document.getElementById("feedback").textContent =
            "You scored " + score + " out of " + questions.length + "!";

        document.getElementById("feedback").style.color = "white";

        document.getElementById("nextButton").hidden = true;
        document.getElementById("checkButton").hidden = true;
    }
}

// Restart the same quiz
function restartQuiz() {

    currentQuestion = 0;
    score = 0;

    displayQuestion();
}

// Start a new quiz with shuffled questions
function newQuiz() {

    questions.sort(() => Math.random() - 0.5);

    currentQuestion = 0;
    score = 0;

    displayQuestion();
}

// Display the first question
displayQuestion();

        </body>




























    
</head>
</html>
