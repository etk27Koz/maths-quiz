
<!DOCTYPE html>
<html>

<head>
    <title>My Maths Quiz</title>

    <style>
        body {
            font-family: Arial;
            background-color: #292929;
            text-align: center;
            padding: 30px;
        }

        .quiz {
            background-color: white;
    width: 700px;
    min-height: 500px;
    padding: 50px;
    border-radius: 10px;
    margin: auto;
        }

        h1 {
            color: red;
        }

        button {
            background-color: red;
            color: white;
            padding: 10px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
            width: 300px
            min-height: 300px
        }

        #error {
            color: red;
            font-weight: bold;
        }

        #feedback {
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="quiz">

    <h1>Maths Quiz</h1>

    <p id="questionNumber"></p>

    <h2 id="question"></h2>

    <div id="answers"></div>

    <p id="error"></p>

    <p id="feedback"></p>

    <button onclick="checkAnswer()" id="checkButton">
        Check Answer
    </button>

    <button onclick="nextQuestion()" id="nextButton" hidden>
        Next Question
    </button>

    <h2 id="score">Score: 0%</h2>

    <button onclick="restartQuiz()">
        Restart Quiz
    </button>

    <button onclick="newQuiz()">
        New Quiz
    </button>

</div>
    <script>

        let questions = [ 
            {  
                question: "what is 2 + 2?",
                    answers: ["3", "4", "5", "10"],
                    correct: "4",
        explaination: "two + two equals four."},

        { 
            question: "what is 2 x 4?",
            answers: ["6", "5", "8", "10"],
            correct: "8",
            explaination: "two x four equals 8."
        },

        {
            question: "whats is 3 divided by 3?",
            answers: ["0", "1", "3", "10"],
                correct: "1",
            explaination: "three divided by 3 is equal to 1."
        },

        {
            
        question: "what is 5 x 7?"
        answers: ["30", "25", "35", "40"],
        correct: "35",
        explaination:"five x seven is equal to 35"

        },

        {
    question: "What is 4 x 6?",
    answers: ["20", "24", "28", "30"],
    correct: "24",
    explanation: "Four times six is equal to 24."
},
{
    question: "What is 8 x 5?",
    answers: ["35", "45", "40", "50"],
    correct: "40",
    explanation: "Eight times five is equal to 40."
},
{
    question: "What is 9 x 3?",
    answers: ["18", "21", "27", "30"],
    correct: "27",
    explanation: "Nine times three is equal to 27."
},
{
    question: "What is 7 x 8?",
    answers: ["54", "56", "48", "64"],
    correct: "56",
    explanation: "Seven times eight is equal to 56."
},
{
    question: "What is 6 x 7?",
    answers: ["36", "40", "42", "48"],
    correct: "42",
    explanation: "Six times seven is equal to 42."
},
{
    question: "What is 12 x 4?",
    answers: ["36", "44", "48", "52"],
    correct: "48",
    explanation: "Twelve times four is equal to 48."
}
        ];

        let currentQuestion = "0";
        let score = "0";
        let selectedAnswer = "";

        function loadQuestion() {

    let q = questions[currentQuestion];

    document.getElementById("questionNumber").innerHTML =
        "Question " + (currentQuestion + 1);

    document.getElementById("question").innerHTML =
        q.question;

    document.getElementById("answers").innerHTML = "";

    q.answers.forEach(function(answer) {

        document.getElementById("answers").innerHTML +=
            `<button onclick="selectAnswer('${answer}')">${answer}</button>`;

    });

}
        function selectAnswer(answer) {

    selectedAnswer = answer;

}
        loadQuestion();
        
            
            

        
        
    </script>




</body>
</html>
