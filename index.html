
<!DOCTYPE html>
<html>

<head>
    <title>My Maths Quiz</title>

    <style>
        body {
            font-family: Arial;
            background-color: #292929;
            text-align: center;
            padding: 30px;
        }

        .quiz {
            background-color: white;
            color: black;
            padding: 25px;
            border-radius: 10px;
            max-width: 500px;
            margin: auto;
        }

        h1 {
            color: red;
        }

        button {
            background-color: red;
            color: white;
            padding: 10px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
        }

        #error {
            color: red;
            font-weight: bold;
        }

        #feedback {
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="quiz">

    <h1>Maths Quiz</h1>

    <p id="questionNumber"></p>

    <h2 id="question"></h2>

    <div id="answers"></div>

    <p id="error"></p>

    <p id="feedback"></p>

    <button onclick="checkAnswer()" id="checkButton">
        Check Answer
    </button>

    <button onclick="nextQuestion()" id="nextButton" hidden>
        Next Question
    </button>

    <h2 id="score">Score: 0</h2>

    <button onclick="restartQuiz()">
        Restart Quiz
    </button>

    <button onclick="newQuiz()">
        New Quiz
    </button>

</div>


<script>

// VARIABLES

let questionNumber = 1;
let score = 0;
let question = 1;


// SHOW THE QUESTION

function showQuestion() {

    document.getElementById("error").innerHTML = "";
    document.getElementById("feedback").innerHTML = "";

    document.getElementById("questionNumber").innerHTML =
        "Question " + questionNumber;

    if (question == 1) {

        document.getElementById("question").innerHTML =
            "What is 5 + 5?";

        document.getElementById("answers").innerHTML =
            '<input type="radio" name="answer" value="10"> 10 <br>' +
            '<input type="radio" name="answer" value="15"> 15 <br>' +
            '<input type="radio" name="answer" value="20"> 20';

    }

    else if (question == 2) {

        document.getElementById("question").innerHTML =
            "What is 10 x 2?";

        document.getElementById("answers").innerHTML =
            '<input type="radio" name="answer" value="10"> 10 <br>' +
            '<input type="radio" name="answer" value="20"> 20 <br>' +
            '<input type="radio" name="answer" value="30"> 30';

    }

    else if (question == 3) {

        document.getElementById("question").innerHTML =
            "What is 20 - 5?";

        document.getElementById("answers").innerHTML =
            '<input type="radio" name="answer" value="10"> 10 <br>' +
            '<input type="radio" name="answer" value="15"> 15 <br>' +
            '<input type="radio" name="answer" value="20"> 20';

    }

    document.getElementById("checkButton").hidden = false;
    document.getElementById("nextButton").hidden = true;

}


// CHECK THE ANSWER

function checkAnswer() {

    let answer = document.querySelector(
        'input[name="answer"]:checked'
    );

    if (answer == null) {

        document.getElementById("error").innerHTML =
            "Please select an answer!";

    }

    else {

        let correctAnswer;

        if (question == 1) {
            correctAnswer = "10";
        }

        else if (question == 2) {
            correctAnswer = "20";
        }

        else if (question == 3) {
            correctAnswer = "15";
        }

        if (answer.value == correctAnswer) {

            document.getElementById("feedback").innerHTML =
                "Correct! Well done!";

            document.getElementById("feedback").style.color = "green";

            score = score + 1;

        }

        else {

            document.getElementById("feedback").innerHTML =
                "Incorrect! The answer was " + correctAnswer;

            document.getElementById("feedback").style.color = "red";

        }

        document.getElementById("score").innerHTML =
            "Score: " + score;

        document.getElementById("checkButton").hidden = true;
        document.getElementById("nextButton").hidden = false;

    }

}


// NEXT QUESTION

function nextQuestion() {

    question = question + 1;
    questionNumber = questionNumber + 1;

    if (question > 3) {

        document.getElementById("question").innerHTML =
            "Quiz finished!";

        document.getElementById("answers").innerHTML = "";

        document.getElementById("questionNumber").innerHTML = "";

        document.getElementById("nextButton").hidden = true;

        document.getElementById("feedback").innerHTML =
            "You scored " + score + " out of 3!";

    }

    else {

        showQuestion();

    }

}


// RESTART QUIZ

function restartQuiz() {

    question = 1;
    questionNumber = 1;
    score = 0;

    document.getElementById("score").innerHTML = "Score: 0";

    showQuestion();

}


// NEW QUIZ

function newQuiz() {

    question = 1;
    questionNumber = 1;
    score = 0;

    document.getElementById("score").innerHTML = "Score: 0";

    showQuestion();

}


// START QUIZ

showQuestion();

</script>

</body>
</html>
