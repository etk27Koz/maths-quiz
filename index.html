<!DOCTYPE html>

<html>

<head>

<title>Welcome to my fun maths quiz!</title>

    <style>
        body {
            font-family:arial;
            background-color: dark grey;
            text-align: center;
            padding: 30px;
        }

        .quiz {
            background-color: white;
            padding: 25px;
            border-radius: 10px;
            max-width: 500px;
            margin: auto;

            
        #feedback {
            font-weight: bold;
        }
    </style>
</head?

    <body>
<div class="quiz">

    <h1>Maths Quiz</h1>

    <p id="questionNumber"></p>

    <h2 id="question"></h2>

        <div id="answers"></div>

        <p id="error"></p>

        <p id="feedback"></p>

        <button id="checkButton" onclick="checkAnswer()">
            Check Answer
        </button>

     <button id="nextButton" onclick="nextQuestion()" hidden>
            Next Question
        </button>

        <h2 id="score"></h2>

        <button onclick="restartQuiz()">
            Restart Quiz
        </button>

        <button onclick="newQuiz()">
            New Quiz
        </button>

</div>
        <script>

// our Maths Questions
            let questions= [ 
                {
                question: "what is 5 + 10?",
                answers: ["7", "10"' "15"],
                correct: "15",
                explanaition: "5 plus 10 equals 15."
            },
                {
                question: "what is 6 x 10?",
                answers: ["16", "60", "55"],
                correct: "60",
                explanaition: "6 times 10 equals 60."
            },
                {
                question: "what is 5 divided by 10?",
                answers: ["2", "0.25"' "0.2"],
                correct: "0.2",
                explanaition: "5 divided 10 equals 0.2,"
            },
                {
                question: "what is 60 + 70?",
                answers: ["13", "120"' "130"],
                correct: "130",
                explanaition: "60 plus 70 equals 130."
            },
                {
                question: "what is 3 x 4?",
                answers: ["7", "12"' "15"],
                correct: "12",
                explanaition: "3 x 4 equals 12."
            },
                {
                question: "what is 15 - 5?",
                answers: ["7", "10"' "20"],
                correct: "10",
                explanaition: "15 minus 5 equals 10."
            },
                {
                question: "what is 5 x 5?",
                answers: ["25", "10"' "30"],
                correct: "25",
                explanaition: "5 x 5 equals 25."
            },
                {
                question: "what is 5 - 10?",
                answers: ["-7", "-10"' "-5"],
                correct: "-5",
                explanaition: "5 minus 10 equals -5."
            },
                {
                question: "what is 5 + 10 - 3?",
                answers: ["12", "10"' "15"],
                correct: "12",
                explanaition: "5 plus 10 minus 3 equals 12."
            },
                {
                question: "what is the square root of 144?",
                answers: ["7", "10"' "12"],
                correct: "12",
                explanaition: "the square root of 144 equals 12"
            },

                // Variables to keep track of the quiz

        let currentQuestion = 0;
        let score = 0;
        let answered = false;


        // Show a question

        function showQuestion() {

            answered = false;

            document.getElementById("error").innerText = "";
            document.getElementById("feedback").innerText = "";

            document.getElementById("questionNumber").innerText =
                "Question " + (currentQuestion + 1) + " of 10";

            document.getElementById("question").innerText =
                questions[currentQuestion].question;

            document.getElementById("answers").innerHTML = "";

            // Show the answer choices

            for (let i = 0; i < 3; i++) {

                document.getElementById("answers").innerHTML +=
                    '<label><input type="radio" name="answer" value="' +
                    questions[currentQuestion].answers[i] +
                    '"> ' +
                    questions[currentQuestion].answers[i] +
                    '</label>';

            }

            document.getElementById("checkButton").hidden = false;
            document.getElementById("nextButton").hidden = true;

        }


        // Check the selected answer

        function checkAnswer() {

            let selectedAnswer =
                document.querySelector('input[name="answer"]:checked');

            // Check if an answer has been selected

            if (selectedAnswer == null) {

                document.getElementById("error").innerText =
                    "Please select an answer!";
                color: red;

                return;

            }

            document.getElementById("error").innerText = "";

            let correctAnswer = questions[currentQuestion].correct;

            let explanation = questions[currentQuestion].explanation;

            // Check if the answer is correct

            if (selectedAnswer.value == correctAnswer) {

                document.getElementById("feedback").innerText =
                    "Correct! " + explanation;

                score++;

            } else {

                document.getElementById("feedback").innerText =
                    "Incorrect! The correct answer is " +
                    correctAnswer + ". " + explanation;

            }

            // Stop the user changing their answer

            let allAnswers = document.querySelectorAll('input[name="answer"]');

            for (let i = 0; i < allAnswers.length; i++) {
                allAnswers[i].disabled = true;
            }

            answered = true;

            document.getElementById("checkButton").hidden = true;
            document.getElementById("nextButton").hidden = false;

            document.getElementById("score").innerText =
                "Your score: " + score;

        }


        // Move to the next question

        function nextQuestion() {

            if (!answered) {
                return;
            }

            currentQuestion++;

            // Check if the quiz has finished

            if (currentQuestion < 10) {

                showQuestion();

            } else {

                showFinalScore();

            }

        }


        // Show the final percentage score

        function showFinalScore() {

            let percentage = (score / 10) * 100;

            document.getElementById("questionNumber").innerText =
                "Quiz Complete!";

            document.getElementById("question").innerText =
                "Well Done!";

            document.getElementById("answers").innerHTML = "";

            document.getElementById("feedback").innerText =
                "You got " + score + " out of 10 questions correct!";

            document.getElementById("score").innerText =
                "Your final percentage is " + percentage + "%";

            document.getElementById("checkButton").hidden = true;
            document.getElementById("nextButton").hidden = true;

        }


        // Restart the same quiz

        function restartQuiz() {

            currentQuestion = 0;
            score = 0;

            showQuestion();

            document.getElementById("score").innerText = "";
            color: red;

        }


        // Start a new quiz with shuffled questions

        function newQuiz() {

            questions.sort(function() {
                return Math.random() - 0.5;
            });

            restartQuiz();

        }


        // Start the quiz when the page loads

        showQuestion();
            
                
        </script>




        
    </body>






























    
</head>
</html>
