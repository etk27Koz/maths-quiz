
<!DOCTYPE html>
<html>

<head>
    <title>My Maths Quiz</title>

    <style>
        body {
            font-family: Arial;
            background-color: #292929;
            text-align: center;
            padding: 30px;
        }

        .quiz {
            background-color: white;
    width: 700px;
    min-height: 500px;
    padding: 50px;
    border-radius: 10px;
    margin: auto;
        }

        h1 {
            color: red;
        }

        button {
            background-color: red;
            color: white;
            padding: 10px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
            width: 300px
            min-height: 300px
        }

        #error {
            color: red;
            font-weight: bold;
        }

        #feedback {
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="quiz">

    <h1>Maths Quiz</h1>

    <p id="questionNumber"></p>

    <h2 id="question"></h2>

    <div id="answers"></div>

    <p id="error"></p>

    <p id="feedback"></p>

    <button onclick="checkAnswer()" id="checkButton">
        Check Answer
    </button>

    <button onclick="nextQuestion()" id="nextButton" hidden>
        Next Question
    </button>

    <h2 id="score">Score: 0%</h2>

    <button onclick="restartQuiz()">
        Restart Quiz
    </button>

    <button onclick="newQuiz()">
        New Quiz
    </button>

</div>




</body>
</html>
