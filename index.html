
<!DOCTYPE html>
<html>

<head>
    <title>My Maths Quiz</title>

    <style>
        body {
            font-family: Arial;
            background-color: #292929;
            text-align: center;
            padding: 30px;
        }

        .quiz {
            background-color: white;
    width: 700px;
    min-height: 500px;
    padding: 50px;
    border-radius: 10px;
    margin: auto;
        }

        h1 {
            color: red;
        }

        button {
            background-color: red;
            color: white;
            padding: 10px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
        }

        #error {
            color: red;
            font-weight: bold;
        }

        #feedback {
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="quiz">

    <h1>Maths Quiz</h1>

    <p id="questionNumber"></p>

    <h2 id="question"></h2>

    <div id="answers"></div>

    <p id="error"></p>

    <p id="feedback"></p>

    <button onclick="checkAnswer()" id="checkButton">
        Check Answer
    </button>

    <button onclick="nextQuestion()" id="nextButton" hidden>
        Next Question
    </button>

    <h2 id="score">Score: 0%</h2>

    <button onclick="restartQuiz()">
        Restart Quiz
    </button>

    <button onclick="newQuiz()">
        New Quiz
    </button>

</div>


<script>

// VARIABLES

let questionNumber = 1;
let score = 0;
let question = 1;


// SHOW THE QUESTION

function showQuestion() {

    document.getElementById("error").innerHTML = "";
    document.getElementById("feedback").innerHTML = "";

    document.getElementById("questionNumber").innerHTML =
        "Question " + questionNumber + " of 10";

    if (question == 1) {

        document.getElementById("question").innerHTML =
            "What is 5 + 5?";

        document.getElementById("answers").innerHTML =
            '<input type="radio" name="answer" value="10"> 10 <br>' +
            '<input type="radio" name="answer" value="15"> 15 <br>' +
            '<input type="radio" name="answer" value="20"> 20';

    }

    else if (question == 2) {

        document.getElementById("question").innerHTML =
            "What is 10 x 2?";

        document.getElementById("answers").innerHTML =
            '<input type="radio" name="answer" value="10"> 10 <br>' +
            '<input type="radio" name="answer" value="20"> 20 <br>' +
            '<input type="radio" name="answer" value="30"> 30';

    }

    else if (question == 3) {

        document.getElementById("question").innerHTML =
            "What is 20 - 5?";

        document.getElementById("answers").innerHTML =
            '<input type="radio" name="answer" value="10"> 10 <br>' +
            '<input type="radio" name="answer" value="15"> 15 <br>' +
            '<input type="radio" name="answer" value="20"> 20';

    }

    else if (question == 4) {

        document.getElementById("question").innerHTML =
            "What is 8 x 3?";

        document.getElementById("answers").innerHTML =
            '<input type="radio" name="answer" value="21"> 21 <br>' +
            '<input type="radio" name="answer" value="24"> 24 <br>' +
            '<input type="radio" name="answer" value="27"> 27';

    }

    else if (question == 5) {

        document.getElementById("question").innerHTML =
            "What is 50 divided by 5?";

        document.getElementById("answers").innerHTML =
            '<input type="radio" name="answer" value="5"> 5 <br>' +
            '<input type="radio" name="answer" value="10"> 10 <br>' +
            '<input type="radio" name="answer" value="15"> 15';

    }

    else if (question == 6) {

        document.getElementById("question").innerHTML =
            "What is 12 + 9?";

        document.getElementById("answers").innerHTML =
            '<input type="radio" name="answer" value="19"> 19 <br>' +
            '<input type="radio" name="answer" value="21"> 21 <br>' +
            '<input type="radio" name="answer" value="23"> 23';

    }

    else if (question == 7) {

        document.getElementById("question").innerHTML =
            "What is 100 - 45?";

        document.getElementById("answers").innerHTML =
            '<input type="radio" name="answer" value="45"> 45 <br>' +
            '<input type="radio" name="answer" value="55"> 55 <br>' +
            '<input type="radio" name="answer" value="65"> 65';

    }

    else if (question == 8) {

        document.getElementById("question").innerHTML =
            "What is 9 x 9?";

        document.getElementById("answers").innerHTML =
            '<input type="radio" name="answer" value="72"> 72 <br>' +
            '<input type="radio" name="answer" value="81"> 81 <br>' +
            '<input type="radio" name="answer" value="90"> 90';

    }

    else if (question == 9) {

        document.getElementById("question").innerHTML =
            "What is 36 divided by 4?";

        document.getElementById("answers").innerHTML =
            '<input type="radio" name="answer" value="8"> 8 <br>' +
            '<input type="radio" name="answer" value="9"> 9 <br>' +
            '<input type="radio" name="answer" value="10"> 10';

    }

    else if (question == 10) {

        document.getElementById("question").innerHTML =
            "What is 15 + 15?";

        document.getElementById("answers").innerHTML =
            '<input type="radio" name="answer" value="25"> 25 <br>' +
            '<input type="radio" name="answer" value="30"> 30 <br>' +
            '<input type="radio" name="answer" value="35"> 35';

    }

    document.getElementById("checkButton").hidden = false;
    document.getElementById("nextButton").hidden = true;

}


// CHECK THE ANSWER

function checkAnswer() {

    let answer = document.querySelector(
        'input[name="answer"]:checked'
    );

    if (answer == null) {

        document.getElementById("error").innerHTML =
            "Please select an answer!";

    }

    else {

        let correctAnswer;

        if (question == 1) {
            correctAnswer = "10";
        }

        else if (question == 2) {
            correctAnswer = "20";
        }

        else if (question == 3) {
            correctAnswer = "15";
        }

        else if (question == 4) {
            correctAnswer = "24";
        }

        else if (question == 5) {
            correctAnswer = "10";
        }

        else if (question == 6) {
            correctAnswer = "21";
        }

        else if (question == 7) {
            correctAnswer = "55";
        }

        else if (question == 8) {
            correctAnswer = "81";
        }

        else if (question == 9) {
            correctAnswer = "9";
        }

        else if (question == 10) {
            correctAnswer = "30";
        }

        if (answer.value == correctAnswer) {

            document.getElementById("feedback").innerHTML =
                "Correct! Well done!";

            document.getElementById("feedback").style.color = "green";

            score = score + 1;

        }

        else {

            document.getElementById("feedback").innerHTML =
                "Incorrect! The answer was " + correctAnswer;

            document.getElementById("feedback").style.color = "red";

        }

        document.getElementById("score").innerHTML =
            "Score: " + score;

        document.getElementById("checkButton").hidden = true;
        document.getElementById("nextButton").hidden = false;

    }

}


// NEXT QUESTION

function nextQuestion() {

    question = question + 1;
    questionNumber = questionNumber + 1;

    if (question > 10) {

        let percentage = (score / 10) * 100;

        document.getElementById("question").innerHTML =
            "Quiz finished!";

        document.getElementById("answers").innerHTML = "";

        document.getElementById("questionNumber").innerHTML = "";

        document.getElementById("nextButton").hidden = true;

        document.getElementById("feedback").innerHTML =
            "You scored " + percentage + "%!";

        document.getElementById("feedback").style.color = "red";

        document.getElementById("score").innerHTML =
            "Final Score: " + percentage + "%";

    }

    else {

        showQuestion();

    }

}


// RESTART QUIZ

function restartQuiz() {

    question = 1;
    questionNumber = 1;
    score = 0;

    document.getElementById("score").innerHTML = "Score: 0%";

    showQuestion();

}


// NEW QUIZ

function newQuiz() {

    question = 1;
    questionNumber = 1;
    score = 0;

    document.getElementById("score").innerHTML = "Score: 0%";

    showQuestion();

}


// START QUIZ

showQuestion();

</script>

</body>
</html>
