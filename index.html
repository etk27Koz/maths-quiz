
<!DOCTYPE html>
<html>

<head>
    <title>My Maths Quiz</title>
     <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>

   
</head>

<body>

<div class="quiz">

    <h1>Maths Quiz</h1>

    <p id="questionNumber"></p>

    <h2 id="question"></h2>

    <div id="answers"></div>

    <p id="error"></p>

    <p id="feedback"></p>

    <button onclick="checkAnswer()" id="checkButton">
        Check Answer
    </button>

    <button onclick="nextQuestion()" id="nextButton" hidden>
        Next Question
    </button>

    <h2 id="score">Score: 0%</h2>

    <button onclick="restartQuiz()">
        Restart Quiz
    </button>

    <button onclick="newQuiz()">
        New Quiz
    </button>

</div>


</body>
</html>
