
<!DOCTYPE html>
<html>
<head>
    <title>Maths Quiz</title>

    <style>
        body {
            font-family: Arial;
            background-color: lightblue;
            text-align: center;
            padding: 30px;
        }

        .quiz {
            background-color: white;
            padding: 25px;
            max-width: 500px;
            margin: auto;
            border-radius: 15px;
        }

        button {
            display: block;
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: none;
            border-radius: 8px;
            background-color: lightgray;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background-color: lightblue;
        }

        .correct {
            background-color: lightgreen;
        }

        .wrong {
            background-color: lightcoral;
        }

        #feedback {
            margin: 15px;
        }

        .controls button {
            background-color: royalblue;
            color: white;
        }
    </style>
</head>

<body>

<div class="quiz">

    <h1>Maths Quiz</h1>

    <p id="number">Question 1 of 10</p>

    <h2 id="question"></h2>

    <div id="answers"></div>

    <p id="feedback"></p>

    <button onclick="continueQuiz()">Continue</button>

    <h2 id="result"></h2>

    <div class="controls">
        <button onclick="restartQuiz()">Restart Quiz</button>
        <button onclick="newQuiz()">New Quiz</button>
    </div>

</div>

<script>

// Our maths questions

let questions = [
    {
        question: "What is 12 x 8?",
        answers: ["86", "96", "108", "92"],
        correct: 1,
        explanation: "12 x 8 = 96."
    },
    {
        question: "What is 144 divided by 12?",
        answers: ["10", "11", "12", "14"],
        correct: 2,
        explanation: "144 divided by 12 = 12."
    },
    {
        question: "What is 25% of 200?",
        answers: ["25", "40", "50", "75"],
        correct: 2,
        explanation: "25% is one quarter, and 200 divided by 4 = 50."
    },
    {
        question: "What is the square root of 81?",
        answers: ["7", "8", "9", "10"],
        correct: 2,
        explanation: "9 x 9 = 81."
    },
    {
        question: "What is 15 + 27?",
        answers: ["40", "42", "43", "45"],
        correct: 1,
        explanation: "15 + 27 = 42."
    },
    {
        question: "What is 7 squared?",
        answers: ["14", "21", "49", "56"],
        correct: 2,
        explanation: "7 squared means 7 x 7 = 49."
    },
    {
        question: "What is 3/4 as a percentage?",
        answers: ["25%", "50%", "75%", "80%"],
        correct: 2,
        explanation: "3 divided by 4 = 0.75, which is 75%."
    },
    {
        question: "A triangle has angles of 60 and 70 degrees. What is the third angle?",
        answers: ["40", "50", "60", "70"],
        correct: 1,
        explanation: "180 - 60 - 70 = 50 degrees."
    },
    {
        question: "What is 5 x (6 + 2)?",
        answers: ["32", "35", "40", "45"],
        correct: 2,
        explanation: "6 + 2 = 8, then 5 x 8 = 40."
    },
    {
        question: "What is the perimeter of a square with 6cm sides?",
        answers: ["12cm", "18cm", "24cm", "36cm"],
        correct: 2,
        explanation: "A square has 4 equal sides, so 6 x 4 = 24cm."
    }
];

// Variables

let current = 0;
let score = 0;
let selected = -1;
let answered = false;

// Show a question

function showQuestion() {

    selected = -1;
    answered = false;

    document.getElementById("number").innerHTML =
        "Question " + (current + 1) + " of 10";

    document.getElementById("question").innerHTML =
        questions[current].question;

    document.getElementById("feedback").innerHTML = "";

    document.getElementById("result").innerHTML = "";

    let answersHTML = "";

    for (let i = 0; i < 4; i++) {
        answersHTML +=
            '<button id="answer' + i +
            '" onclick="selectAnswer(' + i + ')">' +
            questions[current].answers[i] +
            '</button>';
    }

    document.getElementById("answers").innerHTML = answersHTML;
}

// Select an answer

function selectAnswer(number) {

    if (answered) return;

    selected = number;

    for (let i = 0; i < 4; i++) {
        document.getElementById("answer" + i).style.backgroundColor = "lightgray";
    }

    document.getElementById("answer" + number).style.backgroundColor = "lightblue";

}

// Check the answer and continue

function continueQuiz() {

    if (selected == -1) {
        document.getElementById("feedback").innerHTML =
            "Please select an answer first!";
        return;
    }

    // Check the answer

    if (answered == false) {

        answered = true;

        let correct = questions[current].correct;

        if (selected == correct) {

            score++;

            document.getElementById("feedback").innerHTML =
                "Correct! " + questions[current].explanation;

            document.getElementById("answer" + selected).className = "correct";

        } else {

            document.getElementById("feedback").innerHTML =
                "Incorrect! The correct answer is " +
                questions[current].answers[correct] + ". " +
                questions[current].explanation;

            document.getElementById("answer" + selected).className = "wrong";

            document.getElementById("answer" + correct).className = "correct";
        }

        document.getElementById("number").innerHTML =
            "Score: " + score + " / 10";

    } else {

        // Move to the next question

        current++;

        if (current < 10) {
            showQuestion();
        } else {
            finishQuiz();
        }
    }
}

// Finish the quiz

function finishQuiz() {

    document.getElementById("question").innerHTML = "Quiz completed!";

    document.getElementById("answers").innerHTML = "";

    document.getElementById("feedback").innerHTML = "";

    document.getElementById("number").innerHTML = "Final Score";

    document.getElementById("result").innerHTML =
        "You scored " + score + " out of 10!";

}

// Restart the same quiz

function restartQuiz() {

    current = 0;
    score = 0;

    showQuestion();

}

// Start a new quiz with shuffled questions

function newQuiz() {

    questions.sort(function() {
        return Math.random() - 0.5;
    });

    current = 0;
    score = 0;

    showQuestion();

}

// Start the quiz

showQuestion();

</script>

</body>
</html>
