
<!DOCTYPE html>
<html>

<head>
    <title>My Maths Quiz</title>

    <style>
        body {
            font-family: Arial;
            background-color: darkgrey;
            text-align: center;
            padding: 30px;
        }

        .quiz {
            background-color: grey;
            width: 700px;
            min-height: 500px;
            padding: 50px;
            border-radius: 10px;
            margin: auto;

        h1 {

        }

</head>

</body>
</html>
