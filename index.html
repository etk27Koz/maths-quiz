<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Maths Quiz</title>

    <!-- Connect CSS -->
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <main class="quiz">

        <h1>🧮 Maths Quiz</h1>

        <div class="keyboard-help">
            <h3>Keyboard Controls</h3>
            <p>1–4: Select an answer</p>
            <p>C: Check answer</p>
            <p>N: Next question</p>
            <p>R: Restart quiz</p>
            <p>Tab: Move between buttons</p>
            <p>Enter / Space: Activate button</p>
        </div>

        <p id="questionNumber" aria-live="polite"></p>

        <h2 id="question"></h2>

        <div id="answers"></div>

        <p id="error" role="alert"></p>

        <p id="feedback" aria-live="polite"></p>

        <div class="quiz-buttons">

            <button type="button" onclick="checkAnswer()" id="checkButton">
                Check Answer
            </button>

            <button type="button" onclick="nextQuestion()" id="nextButton" hidden>
                Next Question
            </button>

        </div>

        <h2 id="score" aria-live="polite">Score: 0%</h2>

        <div class="extra-buttons">

            <button type="button" onclick="restartQuiz()" class="secondary">
                Restart Quiz
            </button>

            <button type="button" onclick="newQuiz()" class="secondary">
                New Quiz
            </button>

        </div>

    </main>

    <!-- Connect JavaScript -->
    <script src="../javascript/script.js"></script>

</body>
</html>
